---
version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task -l

  all:
    desc: Run all tasks
    cmds:
      - task install-dev
      - task test
      - task type-check
      - task lint

  test:
    desc: Run tests with pytest
    cmds:
      - uv run --no-project pytest --cov=custom_components tests --cov-report=xml

  install-dev:
    desc: Install development dependencies
    cmds:
      - uv venv
      - uv pip install -r requirements-dev.txt

  type-check:
    desc: Type check with mypy
    cmds:
      - uv run --no-project mypy --config-file=pyproject.toml custom_components

  lint:
    desc: Lint with flake8
    cmds:
      - uv run --no-project flake8 custom_components tests
